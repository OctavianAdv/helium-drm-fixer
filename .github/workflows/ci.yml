name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Compiled CLI starts
        shell: bash
        run: |
          bun build cli.ts --compile --outfile ./dist/fix-helium-drm
          ./dist/fix-helium-drm --version
          ./dist/fix-helium-drm --help
