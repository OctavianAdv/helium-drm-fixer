name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build:all
      - name: Create checksums
        working-directory: dist
        run: sha256sum fix-helium-drm-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/fix-helium-drm-windows-x64.exe
            dist/fix-helium-drm-linux-x64
            dist/fix-helium-drm-linux-arm64
            dist/SHA256SUMS.txt
